- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: gemini-gateway
    model: gemini-subscription
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      gemini-gateway:
        displayName: Gemini private gateway
        apiKeyEnv: GEMINI_GATEWAY_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8328/v1
        defaultContextWindow: 65536
        defaultMaxTokens: 4096
        models:
          - id: gemini-subscription
            name: Gemini subscription
            contextWindow: 65536
            reasoningEfforts:
              off:
              low: low
